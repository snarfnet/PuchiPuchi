name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project PuchiPuchi.xcodeproj \
            -scheme PuchiPuchi \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tail -30

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro Max" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app on simulator
        run: |
          APP_PATH=$(find build/DerivedData -name "PuchiPuchi.app" -type d | head -1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Launch app in screenshot mode
        run: |
          xcrun simctl launch "$SIMULATOR_UDID" com.tokyonasu.puchipuchi SCREENSHOT_MODE

      - name: Wait for app to render
        run: sleep 5

      - name: Take screenshot
        run: |
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_UDID" screenshot --type png screenshots/screenshot_6_7.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PuchiPuchi-Screenshots
          path: screenshots/
