name: PuchiPuchi Production Submit

on:
  workflow_dispatch:

concurrency:
  group: puchipuchi-production
  cancel-in-progress: true

jobs:
  submit-production:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          test -n "$ASC_API_KEY_CONTENT"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          if echo "$ASC_API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8"
          else
            echo "$ASC_API_KEY_CONTENT" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8"
          fi
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8" /tmp/asc_key.p8

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Create distribution certificate
        env:
          ASC_KEY_ID: WDXGY9WX55
          ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
          ASC_P8_PATH: /tmp/asc_key.p8
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_KEYCHAIN: build.keychain
        run: |
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          ASC_KEY_ID: WDXGY9WX55
          ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
          ASC_P8_PATH: /tmp/asc_key.p8
          PROFILE_NAME: PuchiPuchi AppStore
          APP_BUNDLE_ID: com.tokyonasu.puchipuchi
          IOS_DISTRIBUTION_CERT_SHA1: ${{ env.IOS_DISTRIBUTION_CERT_SHA1 }}
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          if [ "$BUILD_NUMBER" -lt 112 ]; then
            BUILD_NUMBER=112
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using build number $BUILD_NUMBER"

      - name: Archive
        run: |
          xcodebuild archive             -project PuchiPuchi.xcodeproj             -scheme PuchiPuchi             -configuration Release             -destination "generic/platform=iOS"             -archivePath build/PuchiPuchi.xcarchive             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             DEVELOPMENT_TEAM=83VGKGSQUH             PROVISIONING_PROFILE_SPECIFIER="PuchiPuchi AppStore"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             GAD_APPLICATION_IDENTIFIER="ca-app-pub-9404799280370656~7583950897"             GAD_BANNER_AD_UNIT_ID="ca-app-pub-9404799280370656/6985185095"             -allowProvisioningUpdates             -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8"             -authenticationKeyID WDXGY9WX55             -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

      - name: Export IPA
        run: |
          xcodebuild -exportArchive             -archivePath build/PuchiPuchi.xcarchive             -exportPath build/export             -exportOptionsPlist export_options.plist             -allowProvisioningUpdates             -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8"             -authenticationKeyID WDXGY9WX55             -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

      - name: Submit production review
        env:
          ASC_KEY_ID: WDXGY9WX55
          ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
          ASC_P8_PATH: /tmp/asc_key.p8
          APP_BUNDLE_ID: com.tokyonasu.puchipuchi
          APP_VERSION: "1.0"
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
